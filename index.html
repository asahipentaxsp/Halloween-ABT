<style>
/* Вечерний огород: сумеречный фон, грядки — крафтовые бирки, одна тыквенная кнопка внизу экрана */
:root {
  --dusk: #241A3A;
  --dusk-2: #2F2348;
  --fog: #3B2D5C;
  --line: #55467A;
  --kraft: #EED9B0;
  --kraft-2: #E2C892;
  --ink: #2B1D14;
  --ink-soft: #5A4636;
  --paper: #FBEFD9;
  --paper-soft: #DCD0EA;
  --pumpkin: #F27A1A;
  --pumpkin-press: #B9560C;
  --glow: #FFD15C;
  --moss: #2A5F38;
  --cranberry: #A3222A;
  --veil: rgba(18, 12, 30, .66);

  --hand: 'Caveat', 'Segoe Print', 'Bradley Hand', cursive;
  --body: 'Golos Text', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;

  --t0: 1.125rem;   /* 18 — весь читаемый текст */
  --t1: 1.25rem;    /* 20 */
  --t2: 1.625rem;   /* 26 */
  --t3: 2.125rem;   /* 34 — рукописные названия */
  --t4: 2.75rem;    /* 44 */
  --t5: 4.25rem;    /* 68 — название игры */

  --gl: max(16px, env(safe-area-inset-left, 0px));
  --gr: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { background: var(--dusk); -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--dusk);
  color: var(--paper);
  font: 400 var(--t0)/1.5 var(--body);
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--dusk);
}
svg { display: block; max-width: 100%; height: auto; }
button { font: inherit; color: inherit; }
p { margin: 0; }
h1, h2, h3 { margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
:focus-visible { outline: 3px solid var(--glow); outline-offset: 3px; }

#app {
  max-width: 30rem;
  margin: 0 auto;
  padding-left: var(--gl);
  padding-right: var(--gr);
  padding-block: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
.screen { display: flex; flex-direction: column; gap: 1.25rem; flex: 1; padding-block: 0 1.5rem; }

/* ---------- кнопки ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: .6rem;
  min-height: 3.5rem;
  padding: .5rem 1.5rem;
  border-radius: 14px;
  border: 0;
  font-weight: 600;
  font-size: var(--t1);
  line-height: 1.2;
  text-align: center;
  text-decoration: none;
  cursor: pointer;
  width: 100%;
}
.btn--main { background: var(--pumpkin); color: var(--ink); box-shadow: 0 4px 0 var(--pumpkin-press); }
.btn--main:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--pumpkin-press); }
.btn--ghost { background: transparent; color: var(--paper); border: 2px solid var(--paper-soft); }
.btn--lantern { background: var(--glow); color: var(--ink); }
.btn--line { background: transparent; color: var(--ink); border: 2px solid var(--ink); }
.btn:disabled { opacity: .5; cursor: default; box-shadow: none; }
.btn svg { width: 2rem; flex: none; }

/* ---------- обложка ---------- */
.cover-art { margin-left: calc(-1 * var(--gl)); margin-right: calc(-1 * var(--gr)); }
.cover-art svg { width: 100%; }
.cover h1 {
  font: 700 clamp(3rem, 17vw, var(--t5))/.95 var(--hand);
  color: var(--glow);
  margin-top: -.5rem;
}
.cover .lead { font-size: var(--t1); color: var(--paper); max-width: 26ch; }
.cover .actions { display: flex; flex-direction: column; gap: .75rem; }
.howto { list-style: none; margin: 0; padding: 0; display: grid; gap: .75rem; }
.howto li { display: grid; grid-template-columns: 2.5rem 1fr; gap: .75rem; align-items: center; }
.howto svg { width: 2.5rem; }
.howto-title { font: 700 var(--t3)/1 var(--hand); color: var(--glow); }
.made-by { color: var(--paper-soft); font-size: var(--t0); }

/* ---------- шапка вечера ---------- */
.top {
  background: var(--dusk);
  padding-block: .75rem .75rem;
  border-bottom: 2px solid var(--fog);
  display: grid;
  gap: .6rem;
}

      <ellipse cx="60" cy="65" rx="15" ry="13" fill="${C.pumpkin}" ${INK}/>
      <path d="M60 52 q-1 -6 3 -9" stroke="${C.leaf}" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M86 58 q10 -4 8 -12 q-2 -6 -8 -3" stroke="${C.leaf}" stroke-width="2" fill="none"/></g>`;
    return `${ground()}${leaves}${powder}${pumpkin}`;
  }

  function appleBed(stage) {
    const st = stage || 0;
    const apples = [[42, 34], [62, 26], [80, 36], [52, 48], [74, 50], [30, 46]];
    const rotten = SPOTS[st];
    const fruit = apples.map(([x, y], i) => {
      if (i < rotten && st >= 4 && i < 3) {
        return `<path d="M${x - 5} ${y} q2 -6 5 -5 q4 -1 5 4 q1 6 -5 6 q-6 0 -5 -5z" fill="${C.rotDark}" ${THIN}/><path d="M${x - 3} ${y - 1} l2 2 l2 -2 l2 2" stroke="#8A6A4A" stroke-width="1" fill="none"/>`;
      }
      if (i < rotten) {
        return `<circle cx="${x}" cy="${y}" r="6" fill="${C.rot}" ${THIN}/><circle cx="${x}" cy="${y}" r="3.5" fill="none" stroke="#D8C9A0" stroke-width="1" stroke-dasharray="1.5 1.5"/>`;
      }
      return `<circle cx="${x}" cy="${y}" r="6" fill="${i % 2 ? C.appleYellow : C.apple}" ${THIN}/>`;
    }).join('');
    return `${ground()}
      <path d="M56 74 L57 50 M57 58 L46 50 M58 56 L70 46" stroke="${C.bark}" stroke-width="6" stroke-linecap="round" fill="none"/>
      <path d="M20 40 q-2 -20 18 -24 q8 -14 26 -10 q16 -6 28 6 q16 4 12 22 q4 16 -14 18 q-10 8 -26 4 q-14 6 -26 -2 q-20 0 -18 -14z" fill="${C.leaf}" ${INK}/>
      <path d="M34 22 q6 -4 12 0 M70 18 q6 -2 10 2" stroke="${C.leafLight}" stroke-width="2" fill="none"/>
      ${fruit}`;
  }

  function cabbageBed(stage) {
    const st = stage || 0;
    const head = (x, y, r) => `<g>
      <path d="M${x - r - 8} ${y + 4} q2 -${r} ${r + 8} -${r + 4} q${r + 6} -2 ${r + 8} ${r + 4} q-4 ${r * 0.6} -${r + 8} ${r * 0.6} q-${r + 4} 0 -${r + 8} -${r * 0.6}z" fill="${C.leaf}" ${INK}/>
      <circle cx="${x}" cy="${y}" r="${r}" fill="${C.leafPale}" ${INK}/>
      <path d="M${x - r * 0.6} ${y - 2} q${r * 0.6} -${r * 0.5} ${r * 1.2} 0 M${x - r * 0.4} ${y + 4} q${r * 0.4} -${r * 0.3} ${r * 0.8} 0" stroke="${C.leaf}" stroke-width="1.6" fill="none"/></g>`;
    const wedges = pick([[22, 56], [98, 52], [44, 48], [78, 44], [30, 62], [90, 60]], st)
      .map(([x, y]) => `<path d="M${x - 5} ${y - 4} L${x + 5} ${y - 4} L${x} ${y + 4}Z" fill="${C.yellow}" stroke="${C.vein}" stroke-width="1"/><path d="M${x} ${y - 4} V${y + 3}" stroke="${C.vein}" stroke-width="1.6"/>`).join('');
    const black = st >= 4 ? `<path d="M30 58 q8 -6 16 0 M74 54 q8 -6 16 0" stroke="${C.vein}" stroke-width="3" fill="none"/>` : '';
    return `${ground()}${head(36, 58, 13)}${head(84, 54, 14)}${wedges}${black}`;
  }

  function garlicBed(opts) {
    const done = opts && opts.protected;
    const cloves = [22, 42, 62, 82, 102].map(x => `<path d="M${x} 66 q-5 -2 -4 -8 q2 -5 4 -8 q2 3 4 8 q1 6 -4 8z" fill="${C.mildew}" ${THIN}/>`).join('');
    const tablets = done ? [32, 52, 72, 92].map(x => `<circle cx="${x}" cy="68" r="3" fill="#F2EEE2" ${THIN}/>`).join('') : '';
    const sprouts = done ? [22, 42, 62, 82, 102].map(x => `<path d="M${x} 50 q-2 -8 2 -14" stroke="${C.leaf}" stroke-width="2.5" fill="none" stroke-linecap="round"/>`).join('') : '';
    return `<path d="M0 64 Q60 56 120 64 V90 H0Z" fill="${C.soil}"/><path d="M6 68 H114" stroke="${C.soilDark}" stroke-width="5" stroke-linecap="round"/>${sprouts}${cloves}${tablets}`;
  }

  function soilBed(opts) {
    const done = opts && opts.protected;
    const stalks = done ? '' : [24, 46, 70, 92].map(x => `<path d="M${x} 66 l-6 -18 M${x} 66 l5 -14" stroke="${C.bark}" stroke-width="2.5" stroke-linecap="round"/>`).join('');
    const specks = done ? [14, 26, 38, 50, 62, 74, 86, 98, 106].map((x, i) => `<circle cx="${x}" cy="${70 + (i % 3) * 5}" r="1.8" fill="${C.leafLight}"/>`).join('') : '';
    return `<path d="M0 64 Q60 58 120 64 V90 H0Z" fill="${C.soilDark}"/>
      <path d="M8 74 V38 Q60 -4 112 38 V74" fill="${C.glass}" fill-opacity=".2" ${INK}/>
      ${stalks}${specks}`;
  }

  function harvestedBed(id) {
    const items = {
      tomato: [C.tomato, C.tomato, C.tomato], pumpkin: [C.pumpkin, C.pumpkin, C.pumpkin],
      apple: [C.apple, C.appleYellow, C.apple], cabbage: [C.leafPale, C.leafPale, C.leafPale],
    }[id] || [C.kraft, C.kraft, C.kraft];
    const balls = items.map((fill, i) => `<circle cx="${46 + i * 14}" cy="52" r="8" fill="${fill}" ${THIN}/>`).join('');
    return `${ground()}${balls}<path d="M36 56 H84 L80 76 H40Z" fill="${C.bark}" ${INK}/><path d="M38 64 H82" stroke="${C.ink}" stroke-width="1.6"/>`;
  }

  function bed(id, stage, opts) {
    const o = opts || {};
    const b = D().BEDS.find(x => x.id === id);
    const label = b ? b.name : id;
    let body;
    if (o.harvested) body = harvestedBed(id);
    else if (id === 'tomato') body = tomatoBed(stage);
    else if (id === 'pumpkin') body = pumpkinBed(stage);
    else if (id === 'apple') body = appleBed(stage);
    else if (id === 'cabbage') body = cabbageBed(stage);
    else if (id === 'garlic') body = garlicBed(o);
    else body = soilBed(o);
    if (o.protected && !o.harvested && b && b.kind === 'crop') body += sparkles();
    return svg('0 0 120 90', label, body);
  }

  // ---------- нечисть (100×100) ----------
  const eyes = (x1, x2, y, r = 9, sleepy = false) => {
    const eye = x => sleepy
      ? `<path d="M${x - r} ${y} q${r} ${r * 0.8} ${2 * r} 0" fill="#fff" ${THIN}/><circle cx="${x}" cy="${y + 2.5}" r="${r * 0.35}" fill="${C.ink}"/>`
      : `<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" ${THIN}/><circle cx="${x + 1.5}" cy="${y + 1}" r="${r * 0.5}" fill="${C.ink}"/><circle cx="${x + 3}" cy="${y - 2}" r="${r * 0.18}" fill="#fff"/>`;
    return eye(x1) + eye(x2);
  };
  const cheeks = (x1, x2, y) => `<ellipse cx="${x1}" cy="${y}" rx="4" ry="2.5" fill="#F29A8A" opacity=".7"/><ellipse cx="${x2}" cy="${y}" rx="4" ry="2.5" fill="#F29A8A" opacity=".7"/>`;
  const grin = (x, y, w = 14) => `<path d="M${x - w / 2} ${y} q${w / 2} ${w * 0.55} ${w} 0" fill="${C.ink}" ${THIN}/><path d="M${x - 2} ${y + 3} q2 2 4 0" fill="#E86A6A"/>`;

  const CREATURE_ART = {
    fitofora: () => `
      <ellipse cx="50" cy="92" rx="26" ry="5" fill="${C.ink}" opacity=".18"/>
      <path d="M26 86 q-6 -28 10 -42 q14 -10 28 0 q16 14 10 42 q-24 8 -48 0z" fill="${C.rot}" ${INK}/>
      <circle cx="36" cy="74" r="3" fill="#8A6040"/><circle cx="64" cy="80" r="4" fill="#8A6040"/><circle cx="58" cy="66" r="2.5" fill="#8A6040"/>
      <path d="M18 46 q32 -10 64 0 q-4 6 -32 6 q-28 0 -32 -6z" fill="#4A2F6B" ${INK}/>
      <path d="M32 44 L52 6 L66 44z" fill="#4A2F6B" ${INK}/>
      <path d="M36 38 q16 -5 28 0 l-1 4 q-13 -4 -26 0z" fill="${C.pumpkin}" stroke="${C.ink}" stroke-width="1.4"/>
      <path d="M52 6 q8 2 10 10" stroke="${C.ink}" stroke-width="2" fill="none"/>
      ${eyes(40, 60, 60, 7.5)}${cheeks(33, 67, 70)}${grin(50, 72, 12)}`,
    pautinnica: () => `
      <ellipse cx="50" cy="92" rx="28" ry="5" fill="${C.ink}" opacity=".18"/>
      <path d="M20 70 q-10 -14 4 -24 q0 -18 18 -18 q8 -12 22 -4 q18 -2 18 16 q14 8 4 24 q2 14 -16 14 h-36 q-16 0 -14 -8z" fill="${C.mildew}" ${INK}/>
      <path d="M50 30 V88 M24 58 H80 M30 38 L72 82 M72 38 L30 82" stroke="#CFC8B6" stroke-width="1.2"/>
      <path d="M36 50 q14 -8 28 0 M30 66 q20 10 40 0" stroke="#CFC8B6" stroke-width="1.2" fill="none"/>
      <path d="M30 86 l-4 8 M44 88 l-1 8 M58 88 l1 8 M70 86 l4 8" ${THIN}/>
      ${eyes(40, 60, 56, 8, true)}${cheeks(32, 68, 66)}<path d="M45 70 q5 3 10 0" stroke="${C.ink}" stroke-width="2" fill="none" stroke-linecap="round"/>`,
    mumiya: () => `
      <ellipse cx="50" cy="92" rx="26" ry="5" fill="${C.ink}" opacity=".18"/>

      <path d="M54 16 q10 -6 16 2 q-8 6 -16 -2z" fill="${C.leaf}" ${THIN}/>
      <path d="M20 46 L80 64 M22 62 L78 80 M26 34 L76 48" stroke="#E9DFC7" stroke-width="9" stroke-linecap="round"/>
      <path d="M20 46 L80 64 M22 62 L78 80 M26 34 L76 48" stroke="${C.ink}" stroke-width="1" stroke-dasharray="4 5" opacity=".5"/>
      ${eyes(40, 61, 54, 6.5)}<path d="M42 74 q8 -4 16 0" stroke="${C.ink}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`,
    zhilka: () => `
      <ellipse cx="50" cy="92" rx="28" ry="5" fill="${C.ink}" opacity=".18"/>
      <path d="M50 16 q-34 6 -32 40 q2 30 32 32 q30 -2 32 -32 q2 -34 -32 -40z" fill="#9CC46B" ${INK}/>
      <path d="M22 44 q-4 -6 2 -12 M78 44 q4 -6 -2 -12 M20 62 q-6 2 -4 8 M80 62 q6 2 4 8" stroke="${C.yellow}" stroke-width="5" stroke-linecap="round" fill="none"/>
      <path d="M50 20 V86 M50 40 L32 28 M50 40 L68 28 M50 58 L28 50 M50 58 L72 50 M50 74 L34 72 M50 74 L66 72" stroke="${C.vein}" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      ${eyes(39, 61, 50, 7.5)}${cheeks(31, 69, 60)}
      <path d="M41 64 q9 7 18 0" fill="${C.ink}" ${THIN}/><path d="M50 67 q4 6 7 1" fill="#E86A6A" stroke="${C.ink}" stroke-width="1.2"/>`,
    gniloed: () => `
      <path d="M8 88 q42 -22 84 0 V100 H8z" fill="${C.soil}" ${INK}/>
      <path d="M30 86 q-4 -40 20 -44 q24 4 20 44z" fill="${C.bark}" ${INK}/>
      <path d="M38 44 q-6 -14 -14 -16 M50 42 q0 -16 -4 -24 M62 44 q6 -14 14 -16" stroke="#C8A878" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <ellipse cx="50" cy="70" rx="5" ry="4" fill="#E79A8A" ${THIN}/>
      ${eyes(42, 58, 58, 6.5)}
      <path d="M44 78 h12" stroke="${C.ink}" stroke-width="2" stroke-linecap="round"/><path d="M47 78 v3 M53 78 v3" stroke="#fff" stroke-width="2.4"/>
      <circle cx="20" cy="92" r="2.5" fill="${C.soilDark}"/><circle cx="80" cy="93" r="2" fill="${C.soilDark}"/>`,
    gribnica: () => `
      <ellipse cx="50" cy="94" rx="24" ry="4" fill="${C.ink}" opacity=".15"/>
      <path d="M24 78 q-6 -52 26 -56 q32 4 26 56 q-4 10 -8 2 q-4 10 -9 0 q-4 10 -9 0 q-5 10 -9 0 q-4 8 -8 0z" fill="#DDE8F0" fill-opacity=".92" ${INK}/>
      <path d="M30 82 q-4 6 -10 8 M42 84 q-2 6 -6 10 M58 84 q2 6 6 10 M70 82 q4 6 10 8" stroke="#B8C9D6" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M36 36 q6 -6 14 -4 M60 34 q6 2 8 8" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      ${eyes(41, 59, 52, 7.5)}<ellipse cx="50" cy="68" rx="5" ry="6" fill="${C.ink}"/>`,
  };

  function creature(id) {
    const c = D().CREATURES[id];
    return svg('0 0 100 100', c ? c.name : id, CREATURE_ART[id]());
  }

  // ---------- погода (48×48) ----------
  const sun = (x, y, r) => {
    const rays = [0, 45, 90, 135, 180, 225, 270, 315].map(a => {
      const rad = a * Math.PI / 180;
      return `<path d="M${(x + Math.cos(rad) * (r + 3)).toFixed(1)} ${(y + Math.sin(rad) * (r + 3)).toFixed(1)} L${(x + Math.cos(rad) * (r + 7)).toFixed(1)} ${(y + Math.sin(rad) * (r + 7)).toFixed(1)}" stroke="${C.glow}" stroke-width="2.6" stroke-linecap="round"/>`;
    }).join('');
    return `${rays}<circle cx="${x}" cy="${y}" r="${r}" fill="${C.glow}" ${THIN}/>`;
  };
  const cloud = (x, y, fill = C.sky) => `<path d="M${x - 14} ${y + 8} q-8 0 -8 -7 q0 -7 8 -7 q2 -9 12 -9 q9 0 11 8 q8 -1 9 7 q0 8 -8 8z" fill="${fill}" ${THIN}/>`;
  const drops = (xs, y) => xs.map(x => `<path d="M${x} ${y} q-3 5 0 7 q3 -2 0 -7z" fill="${C.rain}" stroke="${C.ink}" stroke-width="1"/>`).join('');

  const WEATHER_ART = {
    warmWet: () => `${sun(30, 16, 7)}${cloud(22, 24)}${drops([14, 24, 34], 36)}`,
    rain: () => `${cloud(24, 16, '#9F97B6')}${drops([12, 22, 32], 30)}${drops([17, 27], 39)}`,
    fog: () => `${cloud(26, 12)}<path d="M6 30 q6 -3 12 0 t12 0 t12 0 M10 38 q6 -3 12 0 t12 0 t8 0" stroke="#D8D2E6" stroke-width="3" fill="none" stroke-linecap="round"/>`,
    clear: () => sun(24, 24, 10),
    frost: () => `<g stroke="${C.frost}" stroke-width="3" stroke-linecap="round"><path d="M24 6 V42 M8.4 15 L39.6 33 M8.4 33 L39.6 15"/></g><g stroke="${C.frost}" stroke-width="2" stroke-linecap="round" fill="none"><path d="M19 9 l5 5 l5 -5 M19 39 l5 -5 l5 5"/></g><circle cx="24" cy="24" r="4" fill="${C.frost}" ${THIN}/>`,
    overcast: () => `${cloud(20, 18, '#8F88A6')}${cloud(30, 26)}`,
  };

  function weather(id) {
    const w = D().WEATHER[id];
    return svg('0 0 48 48', w ? w.name : id, WEATHER_ART[id]());
  }

  // ---------- препараты (48×56) ----------
  const PRODUCT_COLOR = { alirin: '#4E9A5B', gamair: '#3E78B2', glio: '#8A5CA8', tricho: '#C9873A', vlip: '#E2B33A' };
  const PRODUCT_ART = {
    tube: col => `<rect x="14" y="4" width="20" height="8" rx="3" fill="${col}" ${THIN}/><rect x="11" y="11" width="26" height="40" rx="6" fill="#F4F1EA" ${INK}/><rect x="11" y="22" width="26" height="16" fill="${col}"/><rect x="11" y="11" width="26" height="40" rx="6" fill="none" ${INK}/><circle cx="24" cy="30" r="4" fill="#fff" opacity=".85"/>`,
    jar: col => `<rect x="10" y="10" width="28" height="8" rx="3" fill="${col}" ${THIN}/><rect x="8" y="17" width="32" height="34" rx="8" fill="#F4F1EA" ${INK}/><rect x="8" y="26" width="32" height="14" fill="${col}"/><rect x="8" y="17" width="32" height="34" rx="8" fill="none" ${INK}/><circle cx="18" cy="46" r="2.5" fill="#fff" ${THIN}/><circle cx="26" cy="47" r="2.5" fill="#fff" ${THIN}/>`,
    sachet: col => `<path d="M10 8 H38 L40 50 Q24 54 8 50Z" fill="${col}" ${INK}/><path d="M10 14 H38" stroke="${C.ink}" stroke-width="1.6" stroke-dasharray="2 2"/><path d="M15 26 H33 V38 H15Z" fill="#F4F1EA" ${THIN}/>`,
    canister: col => `<path d="M14 6 H26 V12 H14Z" fill="${C.ink}"/><path d="M28 8 q10 0 10 10" stroke="${C.ink}" stroke-width="3" fill="none"/><rect x="8" y="12" width="32" height="40" rx="5" fill="${col}" ${INK}/><rect x="13" y="24" width="22" height="16" rx="2" fill="#F4F1EA" ${THIN}/><path d="M24 28 q-4 5 0 8 q4 -3 0 -8z" fill="${C.rain}" stroke="${C.ink}" stroke-width="1"/>`,
  };
  const PRODUCT_SHAPE = { alirin: 'tube', gamair: 'tube', glio: 'jar', tricho: 'sachet', vlip: 'canister' };

  function product(id) {
    const p = D().PRODUCTS[id];
    return svg('0 0 48 56', p ? p.name : id, PRODUCT_ART[PRODUCT_SHAPE[id]](PRODUCT_COLOR[id]));
  }

  // ---------- тыквы-фонари (150×50) ----------
  function jack(x, lit) {
    const body = lit ? C.pumpkin : '#7A5A48';
    const face = lit ? C.glow : '#3A2A22';
    const halo = lit ? `<circle cx="${x}" cy="30" r="25" fill="url(#tn-lglow)"/>` : '';
    return `<g class="lantern${lit ? ' lit' : ''}">${halo}
      <ellipse cx="${x - 9}" cy="30" rx="10" ry="15" fill="${body}" ${INK}/>
      <ellipse cx="${x + 9}" cy="30" rx="10" ry="15" fill="${body}" ${INK}/>
      <ellipse cx="${x}" cy="30" rx="12" ry="16" fill="${body}" ${INK}/>
      <path d="M${x} 14 q0 -6 4 -8" stroke="${C.leaf}" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path d="M${x - 10} 25 l4 -6 l4 6z M${x + 2} 25 l4 -6 l4 6z" fill="${face}"/>
      <path d="M${x - 10} 33 q10 9 20 0 l-3 2 l-2 -2 l-3 3 l-2 -3 l-3 3 l-2 -3 l-3 2z" fill="${face}"/></g>`;
  }

  function lanterns(lit) {
    const n = Math.max(0, Math.min(3, lit | 0));
    const defs = `<defs><radialGradient id="tn-lglow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="${C.glow}" stop-opacity=".6"/><stop offset="1" stop-color="${C.glow}" stop-opacity="0"/></radialGradient></defs>`;
    return svg('0 0 150 50', `Горит фонарей: ${n} из 3`, defs + [25, 75, 125].map((x, i) => jack(x, i < n)).join(''));
  }

  // ---------- значки ----------
  const ICONS = {
    lantern: ['Фонарь', `<path d="M12 6 H20 M16 6 V3" stroke="${C.ink}" stroke-width="2" stroke-linecap="round"/><path d="M10 8 H22 L24 12 H8Z" fill="${C.bark}" ${THIN}/><rect x="9" y="12" width="14" height="14" rx="2" fill="${C.glow}" ${THIN}/><path d="M16 15 q-3 4 0 7 q3 -3 0 -7z" fill="${C.pumpkin}"/><path d="M8 26 H24 V29 H8Z" fill="${C.bark}" ${THIN}/>`],
    energy: ['Силы', `<rect x="6" y="12" width="14" height="16" rx="3" fill="${C.moss}" ${THIN}/><path d="M13 12 V7 H18" stroke="${C.ink}" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M20 16 L27 11" stroke="${C.ink}" stroke-width="2.5" stroke-linecap="round"/><circle cx="29" cy="9" r="1.4" fill="${C.rain}"/><circle cx="29" cy="14" r="1.2" fill="${C.rain}"/><circle cx="26" cy="6" r="1.2" fill="${C.rain}"/>`],
  };
  function icon(id) {
    const [label, body] = ICONS[id];
    return svg('0 0 32 32', label, body);
  }

  // ---------- сцена (400×240) ----------
  function scene() {
    const stars = [[30, 22], [70, 48], [120, 18], [168, 40], [214, 14], [252, 52], [96, 82], [190, 72]]
      .map(([x, y], i) => `<circle cx="${x}" cy="${y}" r="${i % 3 ? 1.2 : 1.8}" fill="#FFF3D2" opacity=".85"/>`).join('');
    const pickets = Array.from({ length: 20 }, (_, i) => `<path d="M${6 + i * 20} 196 V166 l5 -6 l5 6 V196z" fill="#2E2346"/>`).join('');
    const bat = (x, y, s) => `<path d="M${x} ${y} q${-6 * s} ${-6 * s} ${-12 * s} ${-2 * s} q${3 * s} ${1 * s} ${4 * s} ${4 * s} q${2 * s} ${-3 * s} ${8 * s} ${-2 * s} q${6 * s} ${-1 * s} ${8 * s} ${2 * s} q${1 * s} ${-3 * s} ${4 * s} ${-4 * s} q${-6 * s} ${-4 * s} ${-12 * s} ${2 * s}z" fill="#15101F"/>`;
    const glowJack = (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s})"><circle cx="0" cy="0" r="34" fill="url(#tn-glow)"/>
      <ellipse cx="-9" cy="0" rx="10" ry="14" fill="${C.pumpkin}" ${INK}/><ellipse cx="9" cy="0" rx="10" ry="14" fill="${C.pumpkin}" ${INK}/><ellipse cx="0" cy="0" rx="12" ry="15" fill="${C.pumpkin}" ${INK}/>
      <path d="M0 -15 q0 -6 4 -8" stroke="${C.leaf}" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path d="M-10 -4 l4 -6 l4 6z M2 -4 l4 -6 l4 6z" fill="${C.glow}"/><path d="M-10 4 q10 9 20 0 l-3 2 l-2 -2 l-3 3 l-2 -3 l-3 3 l-2 -3 l-3 2z" fill="${C.glow}"/></g>`;
    const body = `
      <defs>
        <linearGradient id="tn-sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="${C.dusk}"/><stop offset=".62" stop-color="${C.fog}"/><stop offset="1" stop-color="#6B3F5E"/>

    const spring = r.spring.map(x => `<li>${esc(x.text)}</li>`).join('');
    const review = r.mistakes.length
      ? r.mistakes.map(m => `<article class="mistake"><h3>${esc(m.title)}</h3><p>${esc(m.text)}</p></article>`).join('')
      : `<p class="praise">${esc(r.praise)}</p>`;
    const cheats = D.TEXTS.cheatsheet.map(t => `<li>${t}</li>`).join('');
    const shop = ['alirin', 'gamair', 'glio', 'tricho', 'vlip'].map(pid => {
      const p = D.PRODUCTS[pid];
      return `<li class="shop-item">${A.product(pid)}<div><b>${p.name}</b><p>${p.against}</p>${productLink(pid)}</div></li>`;
    }).join('');
    return `<main class="screen final" data-final>
      <section class="final-hero">
        <h1>Тыквенная ночь</h1>
        <div class="final-lanterns">${A.lanterns(r.stars)}</div>
        <p class="score">Урожай спасён на ${pct}%</p>
        <p>${STAR_TEXT[r.stars]}</p>
      </section>
      <section class="panel" data-final="cellar"><h2>Погреб</h2><ul class="cellar">${cellar}</ul></section>
      <section class="panel" data-final="spring"><h2>А весной…</h2><ul class="plain">${spring}</ul></section>
      <section data-final="review"><h2>Разбор</h2>${review}</section>
      <section class="panel" data-final="cheatsheet"><h2>Шпаргалка на ноябрь</h2><ul class="plain ticks">${cheats}</ul><p class="note">${D.TEXTS.dosage}</p></section>
      <section data-final="products"><h2>Препараты из игры</h2><ul class="shop">${shop}</ul></section>
      <div class="actions">
        <button type="button" class="btn btn--main" data-act="share">Поделиться результатом</button>
        <p class="toast" data-toast aria-live="polite"></p>
        <button type="button" class="btn btn--ghost" data-act="replay">Сыграть ещё раз</button>
      </div>
    </main>`;
  }

  function guideHtml() {
    const items = Object.entries(D.CREATURES).map(([cid, c]) => `<article class="g-item" data-creature="${cid}">
        <div class="g-art">${A.creature(cid)}</div>
        <div><h3>${c.name}</h3><p class="g-disease">${c.disease}</p><p>${c.looks}</p><p><b>Чем защитить:</b> ${c.help}</p>${productLink(c.product, 'Подробнее о препарате')}</div>
      </article>`).join('');
    const v = D.PRODUCTS.vlip;
    return `<div class="veil" data-act="guide-close"></div>
      <section class="sheet guide" role="dialog" aria-modal="true" aria-labelledby="guide-title" data-guide>
        <div class="sheet-head"><h2 id="guide-title">Справочник нечисти</h2><button type="button" class="close" data-act="guide-close">Закрыть</button></div>
        ${items}
        <article class="g-item"><div class="g-art g-art--product">${A.product('vlip')}</div><div><h3>Влип</h3><p>Биоприлипатель: ${v.how}. Обработка держится на листе и не смывается дождём.</p>${productLink('vlip', 'Подробнее о препаратах')}</div></article>
      </section>`;
  }

  const SCREENS = { cover: coverScreen, evening: eveningScreen, report: reportScreen, event: eventScreen, final: finalScreen };

  // ---------- отрисовка ----------
  function render(focusSel) {
    const screen = G ? G.ui.screen : 'cover';
    let html = (SCREENS[screen] || coverScreen)();
    if (sheet && screen === 'evening') html += sheetHtml();
    if (guideOpen) html += guideHtml();
    rootEl.innerHTML = html;
    if (sheet) { sheet.entering = false; sheet.reveal = false; }
    if (focusSel) {
      const el = rootEl.querySelector(focusSel);
      if (el) el.focus({ preventScroll: !!sheet });
    }
  }

  function go(screen) {
    G.ui.screen = screen;
    sheet = null;
    guideOpen = false;
    persist();
    render();
    root.scrollTo(0, 0);
  }

  function openSheet(id) {
    sheet = { bed: id, feedback: '', bad: false, reveal: false, entering: true };
    render('.sheet .close');
  }

  function closeSheet() {
    if (!sheet) return;
    const id = sheet.bed;
    sheet = null;
    render(`[data-bed="${id}"]`);
  }

  // ---------- действия ----------
  const ACTIONS = {
    start() {
      G = { game: S.newGame(seedFromUrl()), ui: { screen: 'evening', tips: 0, vlip: false, report: null, event: null } };
      go('evening');
    },
    continue() {
      if (!saved) return;
      G = saved;
      go(G.ui.screen === 'cover' ? 'evening' : G.ui.screen);
    },
    bed(el) {
      if (!G || G.ui.screen !== 'evening') return;
      openSheet(el.dataset.bed);
    },
    close() { closeSheet(); },
    inspect() {
      const res = S.inspect(G.game, sheet.bed);
      if (!res.ok) return;
      sheet.reveal = true;
      sheet.feedback = '';
      if (G.ui.tips === 0) G.ui.tips = res.creature ? 1 : 2;
      persist();
      render('.sheet .close');
    },
    vlip() {
      G.ui.vlip = !G.ui.vlip;
      persist();
      render('#vlip');
      return 'nolock';
    },
    treat(el) {
      const product = el.dataset.product;
      const res = S.treat(G.game, sheet.bed, product, { vlip: !!G.ui.vlip });
      if (!res.ok) return;
      const [text, bad] = feedbackText(res, product, !!G.ui.vlip);
      sheet.feedback = text;
      sheet.bad = bad;
      sheet.reveal = false;
      if (G.ui.tips === 0 || G.ui.tips === 1) G.ui.tips = 2;
      persist();
      render('[data-feedback]');
    },
    'end-evening'() {
      const report = S.endEvening(G.game);
      if (!report) return;
      G.ui.report = report;
      G.ui.notice = null;
      if (G.ui.tips !== false) G.ui.tips = false;
      go('report');
    },
    next() {
      if (G.game.phase === 'final') { go('final'); return; }
      if (S.neighborPending(G.game)) { G.ui.event = 'neighbor'; go('event'); return; }
      if (G.game.week === 4) { G.ui.event = 'week4'; go('event'); return; }
      go('evening');
    },
    'event-ok'() { G.ui.event = null; go('evening'); },
    'neighbor-bio'() {
      S.chooseNeighbor(G.game, 'bio');
      G.ui.event = null;
      G.ui.notice = 'Валентина пожала плечами: «Как знаешь». Томаты ждут осмотра.';
      go('evening');
    },
    'neighbor-chem'() {
      S.chooseNeighbor(G.game, 'chem');
      G.ui.event = null;
      G.ui.notice = 'Химия сработала: томаты чистые. Но из-за срока ожидания собрать их вовремя не выйдет.';
      go('evening');
    },
    guide() { guideOpen = true; render('.guide .close'); },
    'guide-close'() { guideOpen = false; render('[data-act="guide"]'); },
    share() { shareResult(); },
    replay() {
      G = { game: S.newGame(), ui: { screen: 'evening', tips: false, vlip: G.ui.vlip, report: null, event: null, notice: null } };
      go('evening');
    },
    'skip-tips'() {
      G.ui.tips = false;
      persist();
      render();
    },
  };

  function toast(text) {
    const el = rootEl.querySelector('[data-toast]');
    if (el) el.textContent = text;
  }

  async function shareResult() {
    const r = S.finalReport(G.game);
    const text = D.TEXTS.share.replace('{pct}', Math.round(r.total * 100));
    const url = String(root.location.href).split(/[?#]/)[0];
    const nav = root.navigator || {};
    if (typeof nav.share === 'function') {
      try { await nav.share({ title: 'Тыквенная ночь', text, url }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
    }
    try {
      await nav.clipboard.writeText(`${text} ${url}`);
      toast('Скопировано. Отправьте ссылку подруге в мессенджере.');
    } catch (e) {
      const box = root.document.createElement('textarea');
      box.className = 'copybox';
      box.readOnly = true;
      box.value = `${text} ${url}`;
      const t = rootEl.querySelector('[data-toast]');
      if (t) { t.textContent = 'Выделите текст и скопируйте его:'; t.after(box); box.select(); }
    }
  }

  function onClick(e) {
    const el = e.target.closest('[data-act], button[data-bed]');
    if (!el || el.disabled || !rootEl.contains(el)) return;
    const act = el.dataset.act || 'bed';
    if (!ACTIONS[act]) return;
    const free = act === 'vlip' || act === 'close' || act === 'guide-close';
    // второй тап двойного касания и тапы сразу после смены экрана игнорируются
    if (!free && (e.detail >= 2 || Date.now() < lockUntil)) return;
    const result = ACTIONS[act](el);
    if (result !== 'nolock') lockUntil = Date.now() + 350;
  }

  function onKey(e) {
    if (e.key !== 'Escape') return;
    if (guideOpen) { e.preventDefault(); ACTIONS['guide-close'](); }
    else if (sheet) { e.preventDefault(); closeSheet(); }
  }

  function start(el) {
    rootEl = el;
    saved = loadSave();
    G = null;
    sheet = null;
    rootEl.addEventListener('click', onClick);
    root.document.addEventListener('keydown', onKey);
    render();
  }

  TN.ui = { start };
  if (root.document) {
    const boot = () => { const el = root.document.getElementById('app'); if (el) start(el); };
    if (root.document.readyState === 'loading') root.document.addEventListener('DOMContentLoaded', boot);
    else boot();
  }
})(typeof window !== 'undefined' ? window : globalThis);

</script>
</body>
</html>
